<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barangay Business Directory</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body>
    <section class="hero is-primary">
        <div class="hero-body">
            <p class="title">Local Sari-Sari Directory</p>
            <p class="subtitle">Support local businesses in our barangay</p>
        </div>
    </section>
       <section class="section">
        <div class="container">
            <div class="columns">
                <!-- Business 1 -->
                <div class="column is-one-third">
                    <div class="card">
                        <div class="card-content">
                            <p class="title is-4">Aling Nena's Store</p>
                            <p class="subtitle is-6">Block 4, Lot 12</p>
                            <div class="content">
                                Sells ice, softdrinks, and canned goods. Open until 10 PM.
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
